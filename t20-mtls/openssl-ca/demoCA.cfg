[ ca ]
default_ca	= CA_default		# The default ca section


[ CA_default ]
dir				= ./demoCA		    # Top dir
database		= $dir/index.txt	# Index file
new_certs_dir	= $dir/newcerts		# New certs dir

certificate	= $dir/ca.crt 		    # The CA certificate
serial		= $dir/serial   	    # The current serial number file
private_key	= $dir/private/ca.key	# The private key

default_days		= 3650      # How long to certify for
default_crl_days    = 30		# How long before next CRL
default_md			= sha256	# Use sha256 as default MD
#preserve			= no    #test nada

policy  = policy_all_supplied   # Default policy

name_opt 		= ca_default    # Subject name display option
cert_opt 		= ca_default	# Certificate display option
copy_extensions = copy          # Extension copying option: use with caution.
x509_extensions = usr_cert      # Extensions to be added when a certificate is issued


[ policy_all_supplied ]
countryName	            = supplied
stateOrProvinceName	    = supplied
localityName            = supplied
organizationName	    = supplied
organizationalUnitName	= supplied
commonName		        = supplied
emailAddress		    = supplied


[ usr_cert ]
subjectKeyIdentifier=hash
authorityKeyIdentifier=keyid,issuer
basicConstraints=CA:FALSE

[ req ]
distinguished_name	= CA_default_DN
x509_extensions	= v3_ca


[ CA_default_DN ]
countryName			= "Country Name (2 letter code)"
countryName_default	= "EC"
countryName_min		= 2
countryName_max		= 2

stateOrProvinceName		    = "State or Province Name (full name)"
stateOrProvinceName_default	= "Guayas"

localityName			= Locality Name (eg, city)
localityName_default	= "Guayaquil"

0.organizationName		    = "Organization Name (eg, company)"
0.organizationName_default	= "Demo CA"

organizationalUnitName  = "Organizational Unit Name (eg, section)"

commonName			= "Common Name (e.g. server FQDN or YOUR name)"
commonName_max		= 64

emailAddress		= "Email Address"
emailAddress_max	= 64


[ v3_ca ]
subjectKeyIdentifier    = hash
authorityKeyIdentifier  = keyid:always,issuer:always
basicConstraints        = critical, CA:true